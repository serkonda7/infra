name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * *" # daily at 03:00 UTC, triggers the nightly release
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - id: changes
        run: |
          last=$(git ls-remote origin refs/tags/nightly | cut -f1)
          if [ "$last" = "$GITHUB_SHA" ]; then
            echo "No changes since last nightly ($last), skipping"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.changed == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - if: steps.changes.outputs.changed == 'true'
        run: bun install --frozen-lockfile
      - if: steps.changes.outputs.changed == 'true'
        run: bun run build && mv dist/rig dist/rig-linux-x64
      - if: steps.changes.outputs.changed == 'true'
        run: |
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly dist/rig-linux-x64 \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Nightly $(date -u +%F)" \
            --notes "Built from $GITHUB_SHA"
